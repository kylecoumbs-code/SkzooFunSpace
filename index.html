<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clickable Character Jump</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f2933, #111827);
      font-family: system-ui, sans-serif;
    }

    .stage {
      display: flex;
      gap: 40px;
    }

    .character {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .character:active {
      transform: scale(0.95);
    }

    /* Jump animation */
    @keyframes jump {
      0% {
        transform: translateY(0) scale(1);
      }
      30% {
        transform: translateY(-60px) scale(1.05);
      }
      60% {
        transform: translateY(0) scale(0.98);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    .jumping {
      animation: jump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="character">🐺</div>
    <div class="character">🐇</div>
    <div class="character">🐖</div>
    <div class="character">🦘</div>
  </div>

  <script>
    const characters = document.querySelectorAll('.character');

    characters.forEach((char) => {
      char.addEventListener('click', () => {
        // Restart animation if clicked repeatedly
        char.classList.remove('jumping');
        void char.offsetWidth; // force reflow
        char.classList.add('jumping');
      });
    });
  </script>
</body>
</html>
