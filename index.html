<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clickable Character Jump</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f2933, #111827);
      font-family: system-ui, sans-serif;
      color: white;
    }

    .stage {
      display: flex;
      gap: 40px;
      margin-bottom: 20px;
    }

    #message {
      position: relative;
      opacity: 0;
      font-size: 26px;
      margin-top: 10px;
      pointer-events: none;
    }

    #message.show {
      animation: floatHeart 3s ease-out forwards;
    }

    @keyframes floatHeart {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.8);
      }
      15% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      70% {
        opacity: 1;
        transform: translateY(-40px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.1);
      }
    }

    #message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .character {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .character:active {
      transform: scale(0.95);
    }

    /* Jump animation */
    @keyframes jump {
      0% {
        transform: translateY(0) scale(1);
      }
      30% {
        transform: translateY(-90px) scale(1.05);
      }
      55% {
        transform: translateY(-20px) scale(1);
      }
      75% {
        transform: translateY(-10px) scale(1);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }
      30% {
        transform: translateY(-60px) scale(1.05);
      }
      60% {
        transform: translateY(0) scale(0.98);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    .jumping {
      animation: jump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="character" data-name="wolf">🐺</div>
    <div class="character" data-name="pig">🐖</div>
    <div class="character" data-name="rabbit">🐇</div>
    <div class="character" data-name="llama">🦙</div>
    <div class="character" data-name="squirrel">🐿️</div>
    <div class="character" data-name="chick">🐥</div>
    <div class="character" data-name="puppy">🐶</div>
    <div class="character" data-name="fennec">🦊</div>
  </div>

  <div id="message">💖 wishing you a good day teresa!!!!</div>
    <div class="character" data-name="bunny">🐇</div>
    <div class="character" data-name="pig">🐖</div>
    <div class="character" data-name="quokka">🦘</div>
  </div>

  <div id="message">&lt;3 wishing you a good day teresa!!!!</div>
    <div class="character">🐇</div>
    <div class="character">🐖</div>
    <div class="character">🦘</div>
  </div>

  <script>
    const characters = document.querySelectorAll('.character');

    const message = document.getElementById('message');

    characters.forEach((char) => {
      char.addEventListener('click', () => {
        char.classList.remove('jumping');
        void char.offsetWidth; // force reflow
        char.classList.add('jumping');

        // Special trigger: if this character reaches the "high jump"
        if (char.dataset.name === 'rabbit') {
          message.classList.remove('show');
          void message.offsetWidth;
          message.classList.add('show');
        }
      });
    });
  </script>
</body>
</html>
